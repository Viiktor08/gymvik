name: CI

on: push

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Worker (tsconfig.json) y web (tsconfig.web.json): dos entornos de tipos distintos.
      - run: npm run typecheck
      - run: npm test
